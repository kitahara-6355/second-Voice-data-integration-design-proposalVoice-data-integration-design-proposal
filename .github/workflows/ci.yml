name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          pip install -r scripts/requirements.txt
          pip install -r services/api/requirements.txt

      - name: Run Lint with Ruff
        run: ruff check . --format=github

      - name: Run Unit Tests with Pytest
        id: pytest
        run: pytest --junitxml=pytest-report.xml
        continue-on-error: true

      - name: Run CI Integration Test
        run: |
          chmod +x scripts/ci_test.sh
          ./scripts/ci_test.sh

      - name: Upload Pytest report
        uses: actions/upload-artifact@v4
        if: always() # Always run this step to upload the report even if tests fail
        with:
          name: pytest-report
          path: pytest-report.xml

      - name: Report test results
        uses: dorny/test-reporter@v1
        if: always() # Always run this step to ensure a report is posted
        with:
          name: Pytest Results
          path: pytest-report.xml
          reporter: pytest
          fail-on-error: 'false'
